services:
  punk:
    build: .
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      PUNK_DB_DSN: /data/punk.db
      # PUNK_AI_ENABLED: "true"
      # PUNK_LLM_KEY: ...
      # PUNK_INCIDENT_MCP_TOKEN: ...   # token for an external MCP tool server
    volumes:
      - punk-data:/data
      - ./specs:/app/specs:ro
    command: ["serve", "--config", "/app/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2
    profiles: ["central"]
    ports:
      - "443:443"
      - "80:80"
    environment:
      PUNK_DOMAIN: ${PUNK_DOMAIN:?set PUNK_DOMAIN to the public hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      punk:
        condition: service_healthy

volumes:
  punk-data:
  caddy-data:
