<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punk Records - operator console</title>
<style>
:root{--bg:#05060f;--panel:#0e1226;--line:#1b2142;--amber:#ffb64d;--cyan:#3fe0ff;
--magenta:#ff4fd8;--green:#57ffa0;--ink:#e8ecff;--dim:#8b93b8;
--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif;padding:0 20px 60px}
header{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
h1{font-size:15px;letter-spacing:.2em}
h1 b{color:var(--amber)}
nav{display:flex;gap:6px;margin-left:auto}
nav button{background:none;border:1px solid var(--line);color:var(--dim);padding:6px 14px;
border-radius:6px;cursor:pointer;font:inherit}
nav button.on{color:var(--cyan);border-color:var(--cyan)}
main{max-width:1100px;margin:24px auto}
main:has(#board.on){max-width:1500px}
section{display:none}section.on{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.badge{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--line)}
.b-completed{color:var(--green)}.b-working{color:var(--cyan)}.b-input_required{color:var(--amber)}
.b-failed,.b-canceled{color:var(--magenta)}.b-submitted{color:var(--dim)}
.b-proposed{color:var(--amber)}.b-approved{color:var(--green)}.b-rejected{color:var(--magenta)}
button.act{background:none;border:1px solid var(--line);color:var(--ink);padding:4px 10px;
border-radius:5px;cursor:pointer;font:12px var(--mono);margin-right:6px}
button.act:hover{border-color:var(--cyan)}
.mono{font-family:var(--mono);font-size:12px;color:var(--dim)}
#timeline{margin-top:18px;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel)}
.ev{display:flex;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.ev:last-child{border-bottom:none}
.ev .seq{font-family:var(--mono);color:var(--dim);min-width:36px}
.ev .type{font-family:var(--mono);min-width:130px}
.t-finding{color:var(--green)}.t-tool_call{color:var(--cyan)}.t-error{color:var(--magenta)}
.t-proposal,.t-budget_exhausted{color:var(--amber)}.t-status_change{color:var(--dim)}
.ev pre{white-space:pre-wrap;word-break:break-word;color:var(--dim);font-size:11.5px;margin-top:2px}
.empty{color:var(--dim);padding:26px;text-align:center}
#token{background:var(--panel);border:1px solid var(--line);color:var(--ink);
padding:6px 10px;border-radius:6px;font:12px var(--mono);width:220px}
.kv{color:var(--dim);font-size:12px;margin:10px 0}
.kv b{color:var(--ink)}
.b-done{color:var(--green)}.b-in_progress{color:var(--cyan)}.b-review{color:var(--amber)}
.b-blocked{color:var(--magenta)}.b-pending{color:var(--dim)}
#board .split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
#board table{table-layout:fixed}
#board td{word-break:break-word}
#board col.c-task{width:26%}#board col.c-state{width:11%}#board col.c-holder{width:11%}
#board col.c-dep{width:10%}#board col.c-status{width:28%}#board col.c-upd{width:14%}
#boardhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
#boardstate{background:var(--panel);border:1px solid var(--line);color:var(--ink);
padding:5px 8px;border-radius:6px;font:12px var(--mono)}
.members{color:var(--dim);font-size:11.5px;max-height:3.2em;overflow:hidden}
#nspanel{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px}
#nsfilter{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
padding:6px 8px;border-radius:6px;font:12px var(--mono);margin-bottom:8px}
#nspanel label{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:11.5px;margin-bottom:8px}
#nslist{max-height:70vh;overflow:auto}
.ns{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:6px;cursor:pointer}
.ns:hover{background:#151a35}
.ns.on{background:#151a35;box-shadow:inset 2px 0 0 var(--cyan)}
.ns .name{flex:1;word-break:break-all;font-size:12.5px}
.ns .n{font-family:var(--mono);font-size:11px;color:var(--dim)}
.ns.on .name{color:var(--cyan)}
</style>
</head>
<body>
<header>
  <h1><b>PUNK RECORDS</b> OPERATOR</h1>
  <input id="token" type="password" placeholder="API token (Bearer)" >
  <nav>
    <button data-tab="board" class="on">Board</button>
    <button data-tab="inbox">Inbox</button>
    <button data-tab="tasks">Tasks</button>
    <button data-tab="agents">Agents</button>
    <button data-tab="costs">Costs</button>
  </nav>
</header>
<main>
  <section id="board" class="on">
    <div class="split">
      <aside id="nspanel">
        <input id="nsfilter" placeholder="filter namespaces">
        <label><input id="nstasks" type="checkbox" checked> only with tasks</label>
        <div id="nslist"></div>
      </aside>
      <div>
        <div id="boardhead">
          <select id="boardstate">
            <option value="">all states</option>
            <option value="pending">pending</option>
            <option value="in_progress">in progress</option>
            <option value="review">review</option>
            <option value="blocked">blocked</option>
            <option value="done">done</option>
          </select>
        </div>
        <div id="boardview"></div>
      </div>
    </div>
  </section>
  <section id="inbox">
    <h3 style="margin-bottom:10px">Proposals awaiting approval</h3>
    <div id="proposals"></div>
    <h3 style="margin:24px 0 10px">Parked tasks (input required)</h3>
    <div id="parked"></div>
  </section>
  <section id="tasks">
    <div id="tasklist"></div>
    <div id="timeline" style="display:none"></div>
  </section>
  <section id="agents"><div id="agentlist"></div></section>
  <section id="costs"><div id="costview"></div></section>
</main>
<script>
const $=q=>document.querySelector(q);
const token=()=>localStorage.getItem('amk')||'';
$('#token').value=token();
$('#token').addEventListener('change',e=>{localStorage.setItem('amk',e.target.value);namespaces=null;refresh();});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('main section').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');$('#'+b.dataset.tab).classList.add('on');refresh();
});
async function api(path,opts={}){
  opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(token())opts.headers['Authorization']='Bearer '+token();
  const r=await fetch(path,opts);
  if(!r.ok)throw new Error(path+': '+r.status+' '+await r.text());
  return r.json();
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge=(v,p)=>`<span class="badge b-${esc(v)}">${esc(v)}</span>`;
const usd=m=>'$'+(m/1e6).toFixed(2);

async function loadInbox(){
  try{
    const props=await api('/v1/proposals?status=proposed');
    $('#proposals').innerHTML=props.length?'<table><tr><th>target</th><th>class</th><th>task</th><th>age</th><th></th></tr>'+
      props.map(p=>`<tr><td class="mono">${esc(p.target)}</td><td>${badge(p.action_class)}</td>
      <td class="mono">${esc(p.task_id.slice(0,8))}</td><td class="mono">${esc(p.created_at.slice(0,16))}</td>
      <td><button class="act" onclick="decide('${p.id}','approved')">approve</button>
      <button class="act" onclick="decide('${p.id}','rejected')">reject</button></td></tr>`).join('')+'</table>'
      :'<div class="empty">nothing awaiting approval</div>';
    const parked=await api('/v1/tasks?status=input_required');
    $('#parked').innerHTML=parked.length?'<table><tr><th>task</th><th>agent</th><th>source</th><th>updated</th><th></th></tr>'+
      parked.map(t=>`<tr><td class="mono">${esc(t.id.slice(0,8))}</td><td>${esc(t.agent_name||'-')}</td>
      <td class="mono">${esc(t.external_ref||t.source)}</td><td class="mono">${esc(t.updated_at.slice(0,16))}</td>
      <td><button class="act" onclick="taskAct('${t.id}','requeue')">requeue</button>
      <button class="act" onclick="taskAct('${t.id}','cancel')">cancel</button>
      <button class="act" onclick="showTask('${t.id}')">ledger</button></td></tr>`).join('')+'</table>'
      :'<div class="empty">no parked tasks</div>';
  }catch(e){$('#proposals').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}
}
async function decide(id,status){await api('/v1/proposals/'+id,{method:'PATCH',body:JSON.stringify({status})});loadInbox();}
async function taskAct(id,act){await api('/v1/tasks/'+id+'/'+act,{method:'POST'});refresh();}

async function loadTasks(){
  try{
    const ts=await api('/v1/tasks');
    $('#tasklist').innerHTML=ts.length?'<table><tr><th>task</th><th>status</th><th>agent</th><th>ref</th><th>spend</th><th>created</th></tr>'+
      ts.map(t=>`<tr onclick="showTask('${t.id}')" style="cursor:pointer">
      <td class="mono">${esc(t.id.slice(0,8))}</td><td>${badge(t.status)}</td><td>${esc(t.agent_name||'-')}</td>
      <td class="mono">${esc(t.external_ref||t.source)}</td>
      <td class="mono">${t.spent_tokens} tok / ${t.spent_tool_calls} calls</td>
      <td class="mono">${esc(t.created_at.slice(0,16))}</td></tr>`).join('')+'</table>'
      :'<div class="empty">no tasks yet</div>';
  }catch(e){$('#tasklist').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}
}
async function showTask(id){
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='tasks'));
  document.querySelectorAll('main section').forEach(x=>x.classList.toggle('on',x.id==='tasks'));
  const d=await api('/v1/tasks/'+id);
  const tl=$('#timeline');tl.style.display='block';
  tl.innerHTML=`<div class="kv"><b>${esc(d.task.id)}</b> ${badge(d.task.status)}
    agent <b>${esc(d.task.agent_name||'-')}</b> ref <b class="mono">${esc(d.task.external_ref||'-')}</b></div>`+
    (d.events||[]).map(e=>`<div class="ev"><span class="seq">${e.seq}</span>
    <span class="type t-${esc(e.type)}">${esc(e.type)}</span>
    <div><span class="mono">${esc(e.actor)}</span><pre>${esc(JSON.stringify(e.payload))}</pre></div></div>`).join('');
  tl.scrollIntoView({behavior:'smooth'});
}
async function loadAgents(){
  try{
    const d=await api('/v1/agents');
    $('#agentlist').innerHTML=`<div class="kv">snapshot <b>v${d.snapshot_version}</b> (hot-reloaded)</div>`+
      '<table><tr><th>agent</th><th>version</th><th>autonomy</th><th>skills</th><th>state</th></tr>'+
      (d.agents||[]).map(a=>`<tr><td><b>${esc(a.name)}</b><div class="mono">${esc(a.description)}</div></td>
      <td class="mono">${esc(a.version)} (#${a.version_id})</td><td>${badge(a.autonomy)}</td>
      <td class="mono">${esc((a.skills||[]).join(', ')||'-')}</td>
      <td>${a.disabled?'<span class="badge b-canceled">disabled</span>':'<span class="badge b-completed">active</span>'}</td></tr>`).join('')+'</table>';
  }catch(e){$('#agentlist').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}
}
async function loadCosts(){
  try{
    const c=await api('/v1/costs');
    $('#costview').innerHTML=`<div class="kv">today <b>${usd(c.day_total_microusd)}</b>
      · this month <b>${usd(c.month_total_microusd)}</b></div>`+
      '<table><tr><th>agent</th><th>today</th><th>month</th><th>completed</th><th>avg / investigation</th></tr>'+
      (c.agents||[]).map(a=>`<tr><td>${esc(a.agent)}</td><td class="mono">${usd(a.day_microusd)}</td>
      <td class="mono">${usd(a.month_microusd)}</td><td class="mono">${a.completed_tasks}</td>
      <td class="mono">${usd(a.avg_per_task_microusd)}</td></tr>`).join('')+'</table>';
  }catch(e){$('#costview').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}
}
let ns=localStorage.getItem('ns')||'';
$('#nsfilter').addEventListener('input',renderNamespaces);
$('#nstasks').addEventListener('change',()=>{namespaces=null;loadBoard();});
let namespaces=null;
function pickNS(name){ns=name;localStorage.setItem('ns',name);renderNamespaces();loadNSBoard();}
function renderNamespaces(){
  const q=$('#nsfilter').value.trim().toLowerCase();
  const list=(namespaces||[]).filter(n=>!q||n.name.toLowerCase().includes(q));
  $('#nslist').innerHTML=list.length?list.map(n=>`<div class="ns${n.name===ns?' on':''}" data-ns="${esc(n.name)}">
    <span class="name">${esc(n.name)}</span>
    <span class="n">${n.tasks?n.tasks+'t':''} ${n.facts}f</span></div>`).join('')
    :'<div class="empty">no namespaces</div>';
}
$('#nslist').addEventListener('click',e=>{
  const row=e.target.closest('.ns');
  if(row)pickNS(row.dataset.ns);
});
async function loadBoard(){
  try{
    if(!namespaces){
      const d=await api('/v1/namespaces'+($('#nstasks').checked?'?tasks=1':''));
      namespaces=d.namespaces||[];
      if(!namespaces.some(n=>n.name===ns))ns=namespaces.length?namespaces[0].name:'';
      if(ns)localStorage.setItem('ns',ns);
    }
    renderNamespaces();
    await loadNSBoard();
  }catch(e){$('#nslist').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}
}
async function loadNSBoard(){
  if(!ns){$('#boardview').innerHTML='<div class="empty">no namespace selected</div>';return;}
  try{
    const st=$('#boardstate').value;
    const b=await api('/v1/namespaces/'+encodeURIComponent(ns)+'/tasks'+(st?'?state='+st:''));
    const c=b.counts||{};
    const names=(b.members||[]).map(m=>m.agent||m.name||'').filter(Boolean);
    const shown=names.slice(0,10).map(esc).join(', ')+(names.length>10?' +'+(names.length-10)+' more':'');
    $('#boardview').innerHTML=`<div class="kv"><b>${esc(b.namespace)}</b> · ${c.total||0} tasks ·
      done <b>${c.done||0}</b> · in progress <b>${c.in_progress||0}</b> · review <b>${c.review||0}</b> ·
      blocked <b>${c.blocked||0}</b> · pending <b>${c.pending||0}</b>
      ${b.next?'· next <b>'+esc(b.next)+'</b>':''}
      ${names.length?'<div class="members">members: '+shown+'</div>':''}</div>`+
      ((b.tasks||[]).length?'<table><colgroup><col class="c-task"><col class="c-state">'+
      '<col class="c-holder"><col class="c-dep"><col class="c-status"><col class="c-upd"></colgroup>'+
      '<tr><th>task</th><th>state</th><th>holder</th><th>depends on</th><th>status</th><th>updated</th></tr>'+
      b.tasks.map(t=>`<tr><td><b>${esc(t.id)}</b><div class="mono">${esc(t.title||'')}</div></td>
      <td>${badge(t.state)}${t.ready?' <span class="badge b-in_progress">ready</span>':''}</td>
      <td class="mono">${esc(t.holder||'-')}</td>
      <td class="mono">${esc((t.depends_on||[]).join(', ')||'-')}</td>
      <td class="mono">${esc(t.status||'')}</td>
      <td class="mono">${esc((t.updated_at||'').slice(0,16))}<div>${esc(t.by||'')}</div></td></tr>`).join('')+'</table>'
      :'<div class="empty">no tasks match</div>');
  }catch(e){$('#boardview').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}
}
$('#boardstate').addEventListener('change',loadNSBoard);
function refresh(){
  const tab=document.querySelector('nav button.on').dataset.tab;
  if(tab==='board')loadBoard();
  if(tab==='inbox')loadInbox();
  if(tab==='tasks')loadTasks();
  if(tab==='agents')loadAgents();
  if(tab==='costs')loadCosts();
}
refresh();setInterval(refresh,5000);
</script>
</body>
</html>
