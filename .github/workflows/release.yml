name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # tags needed for git describe
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"          # pure-Go SQLite (modernc); static, cross-compiles cleanly
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME:-$(git describe --tags --always --dirty)}"
          OUT="punk"
          [ "$GOOS" = "windows" ] && OUT="punk.exe"
          go build -ldflags "-s -w -X main.version=${VERSION}" -o "$OUT" ./cmd/punk
          PKG="punk_${VERSION}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then zip "${PKG}.zip" "$OUT" LICENSE README.md; else tar czf "${PKG}.tar.gz" "$OUT" LICENSE README.md; fi
      - uses: actions/upload-artifact@v4
        with:
          name: punk_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            punk_*.tar.gz
            punk_*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum punk_* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/punk_*
            dist/SHA256SUMS.txt
          generate_release_notes: true
