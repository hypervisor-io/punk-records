name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: make build
      - name: Test
        # The full SQLite memory race suite exceeds Go's default 10m package
        # timeout (about 13m in acceptance). Keep every check with a 20m budget.
        run: go test ./... -race -count=1 -timeout=20m
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: punk
          POSTGRES_PASSWORD: punk
          POSTGRES_DB: punk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U punk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Store tests against Postgres
        env:
          PUNK_TEST_PG_DSN: postgres://punk:punk@localhost:5432/punk_test
        # -p 1: packages share one Postgres database; parallel packages
        # would drop each other's schema mid-test.
        run: go test ./internal/... -race -count=1 -p 1
